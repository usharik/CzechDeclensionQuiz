plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

apply from: "${rootProject.projectDir}/gradle/version.gradle"

def getGitCommitHash = { ->
    try {
        def process = ['git', 'rev-parse', '--short', 'HEAD'].execute()
        process.waitFor()
        def hash = process.text.trim()
        return hash.isEmpty() || process.exitValue() != 0 ? 'unknown' : hash
    } catch (Exception e) {
        return 'unknown'
    }
}

android {
    namespace = "com.usharik.app"
    compileSdkVersion = 37
    defaultConfig {
        applicationId = "com.usharik.app"
        minSdkVersion = 28
        targetSdkVersion = 36
        versionCode = getVersionInfo().code
        versionName = getVersionInfo().name
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${getGitCommitHash()}\""

