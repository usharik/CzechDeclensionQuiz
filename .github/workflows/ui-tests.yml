name: UI Tests

on:
  push:
    branches: [ main ]
    tags-ignore:
      - 'v*.*.*'  # Don't run on version tags (deploy workflow handles those)
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ui-tests:
    runs-on: ubuntu-latest  # Linux with KVM acceleration - faster and more reliable
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium
        run: |
          npm install -g appium@3.2.0
          appium driver install uiautomator2
          appium --version
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x ui-tests/*.sh
          chmod +x .github/scripts/run-ui-tests.sh

      - name: Copy dummy google-services.json for CI build
        run: cp utils/google-services.json.dummy app/google-services.json

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      
      - name: Run Instrumentation and UI Tests with Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            .github/scripts/run-ui-tests.sh

      - name: Upload instrumentation test reports
        id: upload_instrumentation_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 30

      - name: Upload test reports
        id: upload_test_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ui-tests/build/reports/tests/
            ui-tests/build/test-results/
          retention-days: 30

      - name: Upload UI test logs
        id: upload_ui_test_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: ui-tests/build/test-results/logs/
          retention-days: 30

      - name: Publish logs summary to workflow output
        if: always()
        run: |
          if [ -f "ui-tests/build/test-results/logs/summary.md" ]; then
            cat ui-tests/build/test-results/logs/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## UI test debug logs" >> "$GITHUB_STEP_SUMMARY"
            echo "- Logs were not generated. Check the test runner output." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- [instrumentation-test-reports](${{ steps.upload_instrumentation_reports.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [test-reports](${{ steps.upload_test_reports.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [ui-test-logs](${{ steps.upload_ui_test_logs.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Check if test results exist
        id: check_results
        if: always()
        run: |
          if [ -f "ui-tests/build/test-results/test/TEST-com.usharik.app.UiTests.xml" ] || \
             ls app/build/outputs/androidTest-results/connected/*/TEST-*.xml >/dev/null 2>&1; then
            echo "results_exist=true" >> $GITHUB_OUTPUT
          else
            echo "results_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish test results
        if: always() && steps.check_results.outputs.results_exist == 'true'
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: |
            ui-tests/build/test-results/test/*.xml
            app/build/outputs/androidTest-results/connected/**/TEST-*.xml
          check_name: Device Test Results

      - name: Comment test results on PR
        if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const globber = await glob.create([
              'ui-tests/build/test-results/test/TEST-*.xml',
              'app/build/outputs/androidTest-results/connected/**/TEST-*.xml',
            ].join('\n'));
            const files = await globber.glob();

            let body = '';

            if (files.length > 0) {
              try {
                let tests = 0, failures = 0, errors = 0;
                for (const path of files) {
                  const xml = fs.readFileSync(path, 'utf8');
                  const testsMatch = xml.match(/tests="(\d+)"/);
                  const failuresMatch = xml.match(/failures="(\d+)"/);
                  const errorsMatch = xml.match(/errors="(\d+)"/);
                  tests += testsMatch ? parseInt(testsMatch[1]) : 0;
                  failures += failuresMatch ? parseInt(failuresMatch[1]) : 0;
                  errors += errorsMatch ? parseInt(errorsMatch[1]) : 0;
                }
                const passed = tests - failures - errors;

                const emoji = (failures === 0 && errors === 0) ? '✅' : '❌';

                body = `${emoji} **Device Test Results** (instrumentation + UI)\n\n`;
                body += `- Total: ${tests}\n`;
                body += `- ✅ Passed: ${passed}\n`;
                body += `- ❌ Failed: ${failures}\n`;
                body += `- ⚠️ Errors: ${errors}\n\n`;
                body += `View detailed results in the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
              } catch (error) {
                body = `⚠️ Tests completed but results could not be parsed.\n\nError: ${error.message}\n\nView logs in the Actions tab.`;
              }
            } else {
              body = `❌ **Device Tests Failed to Run**\n\nNo test results files found. The tests may have failed to execute.\n\nView logs in the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Unable to comment on PR (this is expected for Dependabot PRs):', error.message);
            }

