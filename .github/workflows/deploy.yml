name: Deploy to Google Play

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Bug fixes and improvements'
  
  # Automatic deployment on tag push
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # Needed for creating GitHub releases

env:
  PACKAGE_NAME: com.usharik.app
  # Shared across apps that use the same keystore
  KEYSTORE_SECRET_NAME: KEYSTORE_BASE64
  KEYSTORE_PASSWORD_SECRET_NAME: KEYSTORE_PASSWORD
  # App-specific secrets for this application
  GOOGLE_SERVICES_SECRET_NAME: GOOGLE_SERVICES_JSON
  KEY_ALIAS_SECRET_NAME: KEY_ALIAS
  KEY_PASSWORD_SECRET_NAME: KEY_PASSWORD
  PLAY_SERVICE_ACCOUNT_SECRET_NAME: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON

jobs:
  deploy:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permissions
        run: chmod +x gradlew
      
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets[env.KEYSTORE_SECRET_NAME] }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
      
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets[env.GOOGLE_SERVICES_SECRET_NAME] }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
      
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets[env.KEYSTORE_PASSWORD_SECRET_NAME] }}
          KEY_ALIAS: ${{ secrets[env.KEY_ALIAS_SECRET_NAME] }}
          KEY_PASSWORD: ${{ secrets[env.KEY_PASSWORD_SECRET_NAME] }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release-keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon \
            --stacktrace

      - name: Determine release track
        id: track
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> $GITHUB_OUTPUT
          else
            # For tag pushes, deploy to production
            echo "track=production" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets[env.PLAY_SERVICE_ACCOUNT_SECRET_NAME] }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/apk/release/app-release.apk
          track: ${{ steps.track.outputs.track }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
          body: |
            ## Release ${{ github.ref_name }}

            ${{ inputs.release_notes || 'Bug fixes and improvements' }}

            ### Downloads
            - **APK**: Direct installation file for Android devices

            ### Build Info
            - Build: ${{ github.run_number }}
            - Version: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup keystore
        if: always()
        run: rm -f release-keystore.jks

